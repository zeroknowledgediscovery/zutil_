name: Build theorem PDF

on:
  push:
    branches: [Theorem]
    paths:
      - 'theorem/stochastic_code_rate_theorem.tex'
      - '.github/workflows/build-theorem-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Theorem
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Compile
        working-directory: theorem
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error stochastic_code_rate_theorem.tex
          pdflatex -interaction=nonstopmode -halt-on-error stochastic_code_rate_theorem.tex
      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theorem/stochastic_code_rate_theorem.pdf
          git diff --cached --quiet || git commit -m "Compile stochastic code rate theorem PDF"
          git push origin Theorem
